version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    assignees:
      - "pb30"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 3
    assignees:
      - "pb30"
